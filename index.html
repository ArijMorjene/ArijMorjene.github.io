<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arij Morjene — Ingénieure QHSE</title>
<meta name="description" content="Portfolio d'Arij Morjene, ingénieure QHSE junior : réglementation produit, systèmes ISO, GMP et environnement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   COULEURS — change ici pour modifier tout le site
   ========================================================= */
:root{
  --bg:#F6F7FB; --bg2:#FFFFFF; --ink:#16213E; --soft:#55607A; --line:#DDE3F0;
  --coral:#1F3C88; --sun:#FFD58A; --mint:#2A9D8F; --lav:#5468D4; --sky:#4A90D9; --pink:#E8A0B4;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:clip}
h1,h2,h3,.serif{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.08}
em.it{font-style:normal;color:var(--coral)}
.hl{background:linear-gradient(transparent 62%,var(--sun) 62%);padding:0 4px}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--soft)}

/* nav */
nav{position:sticky;top:0;z-index:50;background:rgba(246,247,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.logo{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;font-size:1.35rem;text-decoration:none}
.logo span{color:var(--coral)}
.links{display:flex;gap:4px;margin-left:auto}
.links a{text-decoration:none;font-weight:500;font-size:.95rem;padding:8px 12px;border-radius:999px;transition:.2s}
.links a:hover{background:var(--sun)}
.lang{display:flex;background:var(--ink);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;font:inherit;font-weight:700;font-size:.8rem;padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--sun);color:var(--ink)}
.burger{display:none;margin-left:auto;border:0;background:var(--ink);color:#fff;border-radius:12px;width:42px;height:42px;font-size:1.2rem;cursor:pointer}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:14px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:.15s;cursor:pointer;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.sun{background:var(--sun)}
.btn.small{padding:8px 14px;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}

/* hero */
.hero{padding:72px 0 64px;background:radial-gradient(600px 380px at 85% 20%,rgba(31,60,136,.10),transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1.25fr .85fr;gap:48px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;box-shadow:3px 3px 0 var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(32,179,155,.25);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(32,179,155,0)}}
.hero h1{font-size:clamp(2.6rem,6vw,4.4rem);font-weight:800;margin:22px 0 18px}
.lead{font-size:1.1rem;color:var(--soft);max-width:560px}
.lead b{color:var(--ink)}
.photo{width:min(340px,80vw);aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:28px;border:2px solid var(--ink);box-shadow:8px 8px 0 #DDE3F3;display:block;justify-self:center;background:#E6ECFA}

/* numbers */
.numbers{padding:10px 0 70px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:2px solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink);overflow:hidden;margin-top:12px}
.stat{padding:26px 24px;border-left:2px dashed var(--line)}
.stat:first-child{border-left:0}
.stat b{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-size:2.4rem;display:block;line-height:1}
.stat:nth-child(1) b{color:#1F3C88}.stat:nth-child(2) b{color:#2A9D8F}.stat:nth-child(3) b{color:#5468D4}.stat:nth-child(4) b{color:#D99A00}
.stat span{color:var(--soft);font-size:.92rem}

/* sections */
section{padding:80px 0}
.alt{background:#fff;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.sec-head .n{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);flex:0 0 46px}
.sec-head h2{font-size:clamp(2rem,4vw,2.8rem)}
.p-lg{font-size:1.2rem;max-width:820px;line-height:1.6}
.p-lg .acc{background:linear-gradient(transparent 62%,#FFE3B0 62%);font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:24px;color:var(--soft)}
.box{background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);padding:26px;box-shadow:4px 4px 0 var(--ink)}
.alt .box{background:var(--bg)}
.hint{color:var(--soft);font-size:.95rem;margin:4px 0 20px}

/* recipe */
.recipe{margin-top:44px}
.recipe h3,.learn h3{font-size:1.6rem}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:16px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.2s;min-height:150px;display:flex;flex-direction:column;gap:8px}
.step:hover{transform:translateY(-3px)}
.step .k{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);font-weight:700}
.step .t{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:700;font-size:1.1rem;line-height:1.2}
.step .q{display:none;color:var(--soft);font-size:.9rem;line-height:1.5}
.step .q b{color:var(--ink)}
.step.on{background:#E6ECFA;box-shadow:4px 4px 0 var(--ink)}
.step.on .q{display:block}

/* learning */
.learn{margin-top:44px}
.learn-top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.learn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lc{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.lc .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:0 0 12px;animation:none;box-shadow:none}
.lc b{display:block;font-size:.97rem}
.lc span{font-size:.85rem;color:var(--soft)}
.s-done{background:var(--mint)!important}.s-doing{background:var(--sun)!important}.s-next{background:#C5CBD8!important}

/* experience */
.exp{display:flex;flex-direction:column;gap:16px}
.exp-item{background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.exp-head{display:grid;grid-template-columns:70px 1fr auto;gap:18px;align-items:start;padding:20px 22px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.exp-head .yr{font-weight:800;color:#fff;background:var(--ink);border-radius:10px;padding:4px 0;text-align:center;font-size:.85rem}
.exp-head h3{font-size:1.3rem}
.exp-head .sum{color:var(--soft);margin-top:4px;font-size:.96rem}
.exp-head .co{font-size:.88rem;font-weight:700;color:var(--coral);text-align:right;white-space:nowrap}
.exp-head .co i{display:grid;place-items:center;margin:8px 0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);font-style:normal;color:var(--ink);background:#fff;transition:.25s}
.exp-item.open .exp-head .co i{transform:rotate(45deg);background:var(--sun)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag2{border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:#fff}
.exp-body{max-height:0;overflow:hidden;transition:max-height .5s ease}
.exp-grid{display:grid;grid-template-columns:70px 1fr 1fr;gap:18px;padding:0 22px 24px}
.exp-grid h4{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin-bottom:8px}
.exp-grid p{color:var(--soft)}
.exp-grid ul{list-style:none}
.exp-grid li{position:relative;padding-left:20px;margin-bottom:7px;color:var(--soft);font-size:.96rem}
.exp-grid li::before{content:"";position:absolute;left:0;top:.6em;width:9px;height:9px;border-radius:3px;background:var(--mint);transform:rotate(45deg)}
.exp-grid li b{color:var(--ink)}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imp{background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:10px 14px}
.imp b{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-size:1.5rem;display:block;line-height:1.1}
.imp span{font-size:.82rem;color:var(--soft)}
.auto{margin-top:14px;background:#E8ECFB;border-radius:14px;padding:12px 14px;font-size:.93rem;color:var(--ink)}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.filters button{font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;border:2px solid var(--ink);background:#fff;cursor:pointer;transition:.15s}
.filters button.on{background:var(--ink);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.proj{background:#fff;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;transition:.2s}
.proj:hover{transform:translateY(-4px)}
.proj.hide{display:none}
.proj-top{height:110px;position:relative;display:flex;align-items:flex-end;padding:14px 18px;border-bottom:2px solid var(--ink)}
.proj-top .num{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;font-size:2.6rem;line-height:1}
.proj-top .cat{position:absolute;top:12px;right:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700}
.proj-b{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.proj-b h3{font-size:1.2rem}
.proj-b p{color:var(--soft);font-size:.95rem}
.proj-b .docs{font-size:.85rem;font-weight:700;color:var(--mint)}
.proj-b .btn{margin-top:auto;align-self:flex-start}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,27,58,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.sheet{background:var(--bg);border:3px solid var(--ink);border-radius:24px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:10px 10px 0 var(--ink);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet-head{padding:24px 26px;border-bottom:2px solid var(--ink);position:relative}
.sheet-head h3{font-size:1.6rem;padding-right:44px;margin-top:4px}
.close{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:1.1rem;cursor:pointer}
.sheet-body{padding:20px 26px 26px}
.sheet-body h4{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:18px 0 6px}
.sheet-body p,.sheet-body li{color:var(--soft)}
.sheet-body ul{padding-left:20px}
.bar{height:22px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width 1.2s ease}
.doclist{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;justify-content:space-between;gap:12px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px 14px;text-decoration:none;font-weight:600;font-size:.92rem}
.doc span{color:var(--soft)}

/* skills, education */
.sk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sk{border:2px solid var(--ink);border-radius:var(--r);padding:20px;background:var(--bg);box-shadow:4px 4px 0 var(--ink)}
.sk h3{font-size:1.1rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border-radius:999px;font-weight:600;font-size:.86rem;border:2px solid var(--ink);background:#fff}
.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:22px;box-shadow:4px 4px 0 var(--ink)}
.card .when{font-weight:700;color:var(--coral);font-size:.9rem}
.card h3{font-size:1.2rem;margin:4px 0 8px}
.card p{color:var(--soft)}
.langs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.langs div{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 14px}
.langs b{display:block}
.langs span{font-size:.85rem;color:var(--soft)}

/* contact */
.contact{background:var(--ink);color:#fff;border-radius:30px;padding:56px 36px;text-align:center}
.contact .eyebrow{color:#CFCBE8}
.contact h2{font-size:clamp(2rem,5vw,3.2rem);margin:12px 0}
.contact p{color:#CFCBE8;max-width:560px;margin:0 auto}
.contact .btns{justify-content:center}
.contact .btn{border-color:#fff;box-shadow:4px 4px 0 var(--sun)}
footer{text-align:center;padding:30px;color:var(--soft);font-size:.9rem}

.reveal{opacity:0;transform:translateY(20px);transition:.7s ease}
.reveal.in{opacity:1;transform:none}

@media (max-width:900px){
  .hero-grid,.cols,.edu-grid{grid-template-columns:1fr}
  .photo{width:min(280px,75vw)}
  .stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:2px dashed var(--line)}
  .steps{grid-template-columns:1fr 1fr}
  .sk-grid{grid-template-columns:1fr}
  .langs{grid-template-columns:repeat(2,1fr)}
  .links{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bg);flex-direction:column;padding:12px 24px;border-bottom:2px solid var(--ink)}
  .links.open{display:flex}
  .burger{display:block}
  .exp-head{grid-template-columns:1fr}.exp-head .co{text-align:left}.exp-head .co i{margin-left:0}
  .exp-grid{grid-template-columns:1fr}.exp-grid .sp{display:none}
  .impact{grid-template-columns:1fr 1fr}
}
</style>
</head>

  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProj(b.dataset.open));

  document.getElementById("skgrid").innerHTML = SKILLS.map(s => `<div class="sk"><h3>${tx(s.t)}</h3><div class="chips">${s.c.map(c=>`<span class="chip">${tx(c)}</span>`).join("")}</div></div>`).join("");
  document.getElementById("langs").innerHTML = LANGS.map(l => `<div><b>${tx(l.b)}</b><span>${tx(l.s)}</span></div>`).join("");
  document.getElementById("assoc").innerHTML = ASSOC.map(a => `<span class="chip">${tx(a)}</span>`).join("");
}

const modal = document.getElementById("modal");
function openProj(id){
  const p = PROJECTS.find(x => x.id === id);
  document.getElementById("m-cat").textContent = p.cat.map(c=>tx(CATS[c])).join(" · ");
  document.getElementById("m-title").textContent = tx(p.title);
  const docs = p.docs.length ? `<h4>${L==="fr"?"Documents":"Documents"}</h4><div class="doclist">${p.docs.map(d=>`<a class="doc" href="${d.file}" target="_blank" rel="noopener">${tx(d.name)}<span>${d.type||"PDF"} ↗</span></a>`).join("")}</div>` : "";
  document.getElementById("m-body").innerHTML = tx(p.body) + docs;
  modal.classList.add("show");
  setTimeout(() => modal.querySelectorAll(".bar i").forEach(i => i.style.width = i.dataset.w + "%"), 80);
}
document.getElementById("m-close").onclick = () => modal.classList.remove("show");
modal.onclick = e => { if (e.target === modal) modal.classList.remove("show"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") modal.classList.remove("show"); });

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { L = b.dataset.l; render(); try{ history.replaceState(null,"","?lang="+L+location.hash) }catch(e){} });
document.getElementById("burger").onclick = () => document.getElementById("links").classList.toggle("open");
document.querySelectorAll("#links a").forEach(a => a.addEventListener("click", () => document.getElementById("links").classList.remove("open")));

const q = new URLSearchParams(location.search).get("lang");
L = q === "en" || q === "fr" ? q : (navigator.language || "fr").startsWith("fr") ? "fr" : "en";
render();

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
